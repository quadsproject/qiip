<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QIIP - Token Management</title>
    <meta name="description" content="Admin token management for QIIP: every generated token by user, last access, usage, and revocation.">
    <link rel="icon" type="image/svg+xml" href="{{ static_asset_url(request, 'img/qiip.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ static_asset_url(request, 'css/dashboard.css') }}">
    <script>var __t=localStorage.getItem('theme')||'dark';document.documentElement.dataset.theme=__t;</script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include "partials/navbar.html" %}

    <div class="dashboard">
        <header class="dashboard-header">
            <div>
                <h1>Tokens</h1>
                <p id="token-count">Loading token data...</p>
            </div>
            <div class="header-right">
                <p id="last-updated"></p>
                <p id="poll-warning"></p>
            </div>
        </header>

        <main id="main-content">
            <div id="error-banner" class="profile-error" hidden></div>

            <section class="card">
                <h2 class="card-title">Users</h2>
                <div class="table-wrap">
                    <table aria-label="Users">
                        <thead id="users-head">
                            <tr>
                                <th scope="col" data-sort="text"><button type="button" class="th-sort">User</button></th>
                                <th scope="col" data-sort="text"><button type="button" class="th-sort">Email</button></th>
                                <th scope="col" data-sort="text"><button type="button" class="th-sort">Admin</button></th>
                                <th scope="col" data-sort="number"><button type="button" class="th-sort">Tokens</button></th>
                                <th scope="col" data-sort="number"><button type="button" class="th-sort">Requests</button></th>
                                <th scope="col" data-sort="number"><button type="button" class="th-sort">Prompt tokens</button></th>
                                <th scope="col" data-sort="number"><button type="button" class="th-sort">Completion tokens</button></th>
                                <th scope="col" data-sort="number"><button type="button" class="th-sort">Total tokens</button></th>
                                <th scope="col" data-sort="number"><button type="button" class="th-sort">Est. premium cost</button></th>
                                <th scope="col">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="users-table-body">
                            <tr class="skeleton-row" aria-hidden="true"><td><span class="skeleton-bar skeleton-bar--lg"></span></td><td><span class="skeleton-bar"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td></tr>
                        </tbody>
                    </table>
                </div>
            </section>

            <section class="card">
                <h2 class="card-title">All tokens</h2>
                <div class="table-wrap">
                    <table aria-label="All tokens">
                        <thead id="tokens-head">
                            <tr>
                                <th scope="col" data-sort="text"><button type="button" class="th-sort">User</button></th>
                                <th scope="col" data-sort="text"><button type="button" class="th-sort">Name</button></th>
                                <th scope="col" data-sort="text"><button type="button" class="th-sort">Prefix</button></th>
                                <th scope="col" data-sort="date"><button type="button" class="th-sort">Created</button></th>
                                <th scope="col" data-sort="date"><button type="button" class="th-sort">Last used</button></th>
                                <th scope="col" data-sort="text"><button type="button" class="th-sort">Status</button></th>
                                <th scope="col" data-sort="text"><button type="button" class="th-sort">Scope</button></th>
                                <th scope="col" data-sort="number"><button type="button" class="th-sort">Requests</button></th>
                                <th scope="col" data-sort="number"><button type="button" class="th-sort">Prompt tokens</button></th>
                                <th scope="col" data-sort="number"><button type="button" class="th-sort">Completion tokens</button></th>
                                <th scope="col" data-sort="number"><button type="button" class="th-sort">Total tokens</button></th>
                                <th scope="col">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="tokens-table-body">
                            <tr class="skeleton-row" aria-hidden="true"><td><span class="skeleton-bar skeleton-bar--lg"></span></td><td><span class="skeleton-bar"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="toast-container"></div>

    <footer>
        <p>QIIP Inference Proxy</p>
    </footer>

    <script>const POLL_INTERVAL_MS = {{ poll_interval * 1000 }};</script>
    <script src="{{ static_asset_url(request, 'js/confirm_dialog.js') }}"></script>
    <script src="{{ static_asset_url(request, 'js/table_sort.js') }}"></script>
    <script src="{{ static_asset_url(request, 'js/format_usd.js') }}"></script>
    <script src="{{ static_asset_url(request, 'js/admin_tokens.js') }}"></script>
</body>
</html>
