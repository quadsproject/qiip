<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QIIP - Chat</title>
    <meta name="description" content="Chat playground for testing models served through the QIIP inference proxy.">
    <link rel="icon" type="image/svg+xml" href="{{ static_asset_url(request, 'img/qiip.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ static_asset_url(request, 'css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ static_asset_url(request, 'css/chat.css') }}">
    <script>var __t=localStorage.getItem('theme')||'dark';document.documentElement.dataset.theme=__t;</script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% set dash_active = active_page == 'dashboard' %}
    {% set chat_active = active_page == 'chat' %}
    <nav class="top-bar" aria-label="Primary">
        <div class="brand">
            <img class="brand-mark" src="{{ static_asset_url(request, 'img/qiip.svg') }}" alt="QIIP" width="29" height="24">
            <span class="brand-sep" aria-hidden="true"></span>
            <span class="brand-sub">Inference Proxy</span>
        </div>
        <div class="nav-links">
            <a href="/dashboard" class="nav-link{{ ' nav-link-active' if dash_active else '' }}"{% if dash_active %} aria-current="page"{% endif %}>Dashboard</a>
            <a href="/chat" class="nav-link{{ ' nav-link-active' if chat_active else '' }}"{% if chat_active %} aria-current="page"{% endif %}>Chat</a>
        </div>
        <button class="theme-toggle" onclick="let t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('theme',t)" aria-label="Toggle color theme">
            <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41"/></svg>
            <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
        </button>
    </nav>

    <main class="chat-page" id="main-content">
        <div class="model-selector-bar">
            <select id="model-select">
                <option value="">Loading models...</option>
            </select>
            <button class="system-prompt-toggle" aria-expanded="false" aria-controls="system-prompt-panel">System Prompt <span class="chevron" aria-hidden="true"></span></button>
        </div>

        <div id="system-prompt-panel" class="system-prompt-panel">
            <div class="system-prompt-inner">
                <textarea id="system-prompt" aria-label="System prompt" rows="3" placeholder="You are a helpful assistant..."></textarea>
            </div>
        </div>

        <div class="message-area" id="message-area" role="log" aria-live="polite">
            <div class="message-area-inner">
                <div class="empty-state" id="empty-state">
                    <h2>Start a conversation</h2>
                    <p>Select a model above and type a message to begin.</p>
                </div>
            </div>
        </div>

        <div class="input-bar">
            <textarea id="chat-input" placeholder="Type a message..." rows="1"></textarea>
            <button id="send-btn" type="button" class="btn btn-primary" disabled>Send</button>
        </div>
    </main>

    <div id="toast-container"></div>

    <script src="{{ static_asset_url(request, 'vendor/marked-18.0.7/marked.umd.js') }}"></script>
    <script src="{{ static_asset_url(request, 'vendor/dompurify-3.4.12/purify.min.js') }}"></script>
    <script src="{{ static_asset_url(request, 'js/chat.js') }}"></script>
</body>
</html>
