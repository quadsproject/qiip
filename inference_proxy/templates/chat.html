<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QIIP - Chat</title>
    <meta name="description" content="Chat playground for testing models served through the QIIP inference proxy.">
    <link rel="icon" type="image/svg+xml" href="{{ static_asset_url(request, 'img/qiip.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ static_asset_url(request, 'css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ static_asset_url(request, 'css/chat.css') }}">
    <script>var __t=localStorage.getItem('theme')||'dark';document.documentElement.dataset.theme=__t;</script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include "partials/navbar.html" %}

    <main class="chat-page" id="main-content">
        <div class="model-selector-bar">
            <select id="model-select">
                <option value="">Loading models...</option>
            </select>
            <button class="system-prompt-toggle" aria-expanded="false" aria-controls="system-prompt-panel">System Prompt <span class="chevron" aria-hidden="true"></span></button>
        </div>

        <div id="system-prompt-panel" class="system-prompt-panel">
            <div class="system-prompt-inner">
                <textarea id="system-prompt" aria-label="System prompt" rows="3" placeholder="You are a helpful assistant..."></textarea>
            </div>
        </div>

        <div class="message-area" id="message-area" role="log" aria-live="polite">
            <div class="message-area-inner">
                <div class="empty-state" id="empty-state">
                    <h2>Start a conversation</h2>
                    <p>Select a model above and type a message to begin.</p>
                </div>
            </div>
        </div>

        <div class="input-bar">
            <textarea id="chat-input" placeholder="Type a message..." rows="1"></textarea>
            <button id="send-btn" type="button" class="btn btn-primary" disabled>Send</button>
        </div>
    </main>

    <div id="toast-container"></div>

    <script src="{{ static_asset_url(request, 'vendor/marked-18.0.7/marked.umd.js') }}"></script>
    <script src="{{ static_asset_url(request, 'vendor/dompurify-3.4.12/purify.min.js') }}"></script>
    <script src="{{ static_asset_url(request, 'js/chat.js') }}"></script>
</body>
</html>
