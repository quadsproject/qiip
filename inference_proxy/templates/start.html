<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>qiip</title>
    <meta name="description" content="Get your coding tools connected to qiip in about a minute.">
    <link rel="icon" type="image/svg+xml" href="{{ static_asset_url(request, 'img/qiip.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ static_asset_url(request, 'css/dashboard.css') }}">
    <link rel="stylesheet" href="{{ static_asset_url(request, 'css/start.css') }}">
    <script>var __t=localStorage.getItem('theme')||'dark';document.documentElement.dataset.theme=__t;</script>
</head>
<body class="ob-body">
    <div class="ob-aurora" aria-hidden="true"><span></span><span></span><span></span></div>
    <div class="ob-progress" aria-hidden="true"><div class="ob-progress-bar" id="ob-progress-bar"></div></div>

    <header class="ob-top">
        <img class="ob-logo" src="{{ static_asset_url(request, 'img/qiip.svg') }}" alt="qiip" width="40" height="33">
        <a class="ob-link" href="/leaderboard">Leaderboard</a>
        {% include "partials/account_actions.html" %}
    </header>

    <main class="ob-stage" id="ob-stage" aria-live="polite">
        <div class="ob-loading" id="ob-loading"><span></span><span></span><span></span></div>
    </main>

    <footer class="ob-foot">
        <button type="button" class="ob-link ob-back" id="ob-back" hidden>
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
            Back
        </button>
        <span class="ob-hint" id="ob-hint"></span>
    </footer>

    <div class="ob-toast" id="ob-toast" role="status"></div>
    <script src="{{ static_asset_url(request, 'js/model_info.js') }}"></script>
    <script src="{{ static_asset_url(request, 'js/clipboard.js') }}"></script>
    <script src="{{ static_asset_url(request, 'js/start.js') }}"></script>
</body>
</html>
