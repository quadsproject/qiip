<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QUADS — Node Fleet Dashboard</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Open+Sans:wght@400;500;600;700&family=Poppins:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ static_asset_url(request, 'css/dashboard.css') }}">
    <script>var __t=localStorage.getItem('theme')||'dark';document.documentElement.dataset.theme=__t;</script>
</head>
<body>
    <nav class="top-bar" aria-label="Primary">
        <div class="brand">
            <span class="brand-icon" aria-hidden="true">Q</span>
            QUADS
            <span class="brand-sep" aria-hidden="true"></span>
            <span class="brand-sub">Inference Proxy</span>
        </div>
        <div class="nav-links">
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/chat" class="nav-link">Chat</a>
        </div>
        <button class="theme-toggle" onclick="let t=document.documentElement.dataset.theme==='dark'?'light':'dark';document.documentElement.dataset.theme=t;localStorage.setItem('theme',t);this.textContent=t==='dark'?'☀️':'🌙'" aria-label="Toggle theme"><script>document.write(__t==='dark'?'☀️':'🌙')</script></button>
    </nav>

    <div class="dashboard">
        <header class="dashboard-header">
            <div>
                <h1>Node Fleet</h1>
                <p id="node-count">Loading node data...</p>
            </div>
            <div class="header-right">
                <span id="quads-status"></span>
                <p id="last-updated"></p>
                <p id="poll-warning"></p>
            </div>
        </header>

        <main>
            <section class="card">
                <h2 class="card-title">Nodes <a href="#" class="manual-setup-toggle" id="manual-setup-toggle">+ Manual setup</a></h2>
                <div id="manual-setup-row" style="display: none;">
                    <form id="setup-form" class="setup-form">
                        <input type="text" id="setup-hostname" placeholder="Enter hostname" required>
                        <label>Engine <select id="setup-engine-select" class="setup-select setup-engine-select"></select></label>
                        <select id="model-select" class="setup-select setup-model-select" aria-label="vLLM model"></select>
                        <select id="artifact-select" class="setup-select setup-artifact-select" aria-label="GGUF artifact" style="display:none"></select>
                        <label class="standalone-label"><input type="checkbox" id="setup-standalone"> Standalone (no QUADS)</label>
                        <button type="submit" id="setup-btn">Setup Node</button>
                        <span id="model-status" style="color:var(--muted);font-size:0.875rem;display:none"></span>
                    </form>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">Node ID</th>
                                <th scope="col">GPU Vendor</th>
                                <th scope="col">GPU Model</th>
                                <th scope="col">Engine</th>
                                <th scope="col">Model</th>
                                <th scope="col">Config</th>
                                <th scope="col">State</th>
                                <th scope="col">Requests</th>
                                <th scope="col">Actions</th>
                            </tr>
                        </thead>
                        <tbody id="node-table-body">
                            <tr><td colspan="9">Loading node data...</td></tr>
                        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="toast-container"></div>

    <footer>
        <p>QUADS Inference Proxy</p>
    </footer>

    <script>const POLL_INTERVAL_MS = {{ poll_interval * 1000 }};</script>
    <script src="{{ static_asset_url(request, 'js/config_download.js') }}"></script>
    <script src="{{ static_asset_url(request, 'js/setup_selection.js') }}"></script>
    <script src="{{ static_asset_url(request, 'js/dashboard.js') }}"></script>
</body>
</html>
