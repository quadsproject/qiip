<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>QIIP - Node Fleet Dashboard</title>
    <meta name="description" content="Operations dashboard for QIIP: monitor inference nodes, provisioning status, and fleet health.">
    <link rel="icon" type="image/svg+xml" href="{{ static_asset_url(request, 'img/qiip.svg') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=Manrope:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ static_asset_url(request, 'css/dashboard.css') }}">
    <script>var __t=localStorage.getItem('theme')||'dark';document.documentElement.dataset.theme=__t;</script>
</head>
<body>
    <a class="skip-link" href="#main-content">Skip to content</a>
    {% include "partials/navbar.html" %}

    <div class="dashboard">
        <header class="dashboard-header">
            <div>
                <h1>Node Fleet</h1>
                <p id="node-count">Loading node data...</p>
            </div>
            <div class="header-right">
                <span id="quads-status"></span>
                <p id="last-updated"></p>
                <p id="poll-warning"></p>
            </div>
        </header>

        <main id="main-content">
            <section class="card">
                <h2 class="card-title">Nodes <button type="button" class="manual-setup-toggle" id="manual-setup-toggle">+ Manual setup</button></h2>
                <div id="manual-setup-row" style="display: none;">
                    <form id="register-form" class="setup-form">
                        <input type="text" id="register-hostname" placeholder="Enter hostname" required>
                        <label class="standalone-label" for="register-self-setup">
                            <input type="checkbox" id="register-self-setup">
                            Existing vLLM instance
                        </label>
                        <button type="submit" id="register-btn" class="btn btn-primary">Add to Pool</button>
                    </form>
                </div>
                <div class="table-wrap">
                    <table>
                        <thead>
                            <tr>
                                <th scope="col">Node ID</th>
                                <th scope="col">GPU Vendor</th>
                                <th scope="col">GPU Model</th>
                                <th scope="col">Engine</th>
                                <th scope="col">Model</th>
                                <th scope="col">Config</th>
                                <th scope="col">State</th>
                                <th scope="col">Requests</th>
                                <th scope="col">Actions</th>
                            </tr>
                        </thead>
        <tbody id="node-table-body">
            <tr class="skeleton-row" aria-hidden="true"><td><span class="skeleton-bar skeleton-bar--lg"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td></tr>
            <tr class="skeleton-row" aria-hidden="true"><td><span class="skeleton-bar skeleton-bar--lg"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td></tr>
            <tr class="skeleton-row" aria-hidden="true"><td><span class="skeleton-bar skeleton-bar--lg"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td><td><span class="skeleton-bar skeleton-bar--sm"></span></td></tr>
        </tbody>
                    </table>
                </div>
            </section>
        </main>
    </div>

    <div id="toast-container"></div>

    <footer>
        <p>QIIP Inference Proxy</p>
    </footer>

    <script>const POLL_INTERVAL_MS = {{ poll_interval * 1000 }};</script>
    <script src="{{ static_asset_url(request, 'js/confirm_dialog.js') }}"></script>
    <script src="{{ static_asset_url(request, 'js/config_download.js') }}"></script>
    <script src="{{ static_asset_url(request, 'js/setup_selection.js') }}"></script>
    <script src="{{ static_asset_url(request, 'js/dashboard.js') }}"></script>
</body>
</html>
