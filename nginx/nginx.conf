# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

user nginx;
worker_processes auto;
worker_rlimit_nofile 65535;
error_log /var/log/nginx/error.log warn;
pid /run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 4096;
}

http {
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main buffer=64k flush=5s;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 4096;
    server_tokens off;
    gzip off;   # SSE-critical: gzip needs buffering; streaming + gzip are incompatible.

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;

    # Explicit temp paths under /var/cache/nginx (a writable tmpfs in the
    # rootless container; a directory created by the RPM method's install
    # step). The Fedora package compile-time default is /var/lib/nginx/tmp,
    # which is read-only under the container's ReadOnly=true rootfs.
    client_body_temp_path /var/cache/nginx/client_temp;
    proxy_temp_path       /var/cache/nginx/proxy_temp;
    fastcgi_temp_path     /var/cache/nginx/fastcgi_temp;
    uwsgi_temp_path       /var/cache/nginx/uwsgi_temp;
    scgi_temp_path        /var/cache/nginx/scgi_temp;

    # Bare-metal nginx on the same host as the gateway uses 127.0.0.1:5000.
    # The rootless Podman container reaches the gateway via the Podman-injected
    # host.containers.internal hostname (see nginx/nginx.md); the deploy step
    # substitutes that hostname when it plants the container config.
    upstream qiip_upstream {
            server 127.0.0.1:5000;
            keepalive 32;
    }

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    include /etc/nginx/conf.d/*.conf;

    # Plaintext HTTP exists only to force TLS; all API/SSE traffic must be HTTPS.
    # 308 (not 301) preserves the request method and body.
    server {
        listen       80;
        listen       [::]:80;
        server_name  _;
        return 308 https://$host$request_uri;
    }

    # TLS termination for the QIIP gateway. The {FQDN} placeholder in the
    # cert paths is substituted at deploy time.
    server {
        listen       443 ssl default_server;
        listen       [::]:443 ssl default_server;
        server_name  _;
        http2 on;   # nginx >= 1.25.1; the listen ... http2 parameter is deprecated

        ssl_certificate     "/etc/pki/tls/certs/{FQDN}.pem";
        ssl_certificate_key "/etc/pki/tls/certs/{FQDN}.key";
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_session_cache   shared:SSL:10m;
        ssl_session_timeout 10m;
        ssl_ciphers         PROFILE=SYSTEM;
        ssl_prefer_server_ciphers on;

        location = / {
                return 302 /dashboard;
        }

        location / {
                client_max_body_size 50m;
                client_body_buffer_size 1m;
                client_body_timeout 120;
                proxy_pass http://qiip_upstream/;
                proxy_redirect off;
                proxy_http_version 1.1;
                proxy_set_header Connection "";
                proxy_set_header Host $http_host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header X-Forwarded-Proto $scheme;
                proxy_send_timeout 300;
                proxy_read_timeout 3600;
                send_timeout 3600;
                proxy_buffering off;
        }
    }
}
