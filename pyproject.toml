[project]
name = "inference-proxy"
version = "0.1.0"
description = "QUADS LLM Inference Proxy - routes requests to vLLM nodes"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.135,<1.0",
    "uvicorn[standard]>=0.45",
    "pydantic>=2.10,<3.0",
    "pydantic-settings>=2.14",
    "structlog>=26.1.0",
    # The raw watch, revision, and lease adapter is exercised against this floor.
    "etcd3gw>=2.7.0",
    "httpx>=0.28,<1.0",
    "httpx-sse>=0.4.3",
    "jinja2>=3.1",
    "asyncssh>=2.20,<3.0",
    "huggingface-hub>=1.25,<2.0",
]

[dependency-groups]
dev = [
    "ruff>=0.15",
    "mypy>=2.1",
    "pytest>=8.0",
    "pytest-asyncio>=1.4",
    "pytest-httpx>=0.36",
    "httpx2>=2.7,<3.0",
    "coverage>=7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.coverage.run]
branch = true
source = ["inference_proxy"]

[tool.coverage.report]
fail_under = 91.5
precision = 2
show_missing = true

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "N"]
# Ruff's formatter intentionally leaves long strings and comments intact.
ignore = ["E501"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI dependency declarations are intentionally evaluated as defaults.
extend-immutable-calls = ["fastapi.Depends"]

[tool.ruff.lint.per-file-ignores]
# Keep the existing str/Enum stringification contract for API values.
"inference_proxy/models/admin.py" = ["UP042"]
# Test settings must be installed before importing the application.
"tests/conftest.py" = ["E402"]
# Nested patch contexts keep the setup readable in this legacy test module.
"tests/provisioning/test_provisioner.py" = ["SIM117"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
