name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Resolve pinned uv version
        id: uv_pin
        shell: bash
        run: |
          version="$(<auto-vllm/.uv-version)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=auto-vllm/.uv-version::Expected a semantic version, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
          version: ${{ steps.uv_pin.outputs.version }}

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Check node dependency lock
        env:
          UV_PROJECT_ENVIRONMENT: /tmp/auto-vllm-lock-check
        run: |
          uv lock --check --project auto-vllm
          uv sync --project auto-vllm --frozen --no-dev --no-install-project --no-build --python 3.12 --python-platform x86_64-manylinux_2_34 --dry-run

      - name: Check node scripts
        run: shellcheck auto-vllm/*.sh auto-llamacpp/*.sh common/*.sh

      - name: Type check
        run: uv run --frozen mypy inference_proxy tests

      - name: Test with coverage
        run: |
          uv run --frozen coverage run -m pytest
          uv run --frozen coverage report

      - name: Extract badge values
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        id: badges
        run: |
          uv run --frozen coverage json -o /tmp/cov.json
          cov=$(python3 -c "import json; print(round(json.load(open('/tmp/cov.json'))['totals']['percent_covered'], 1))")
          echo "coverage=$cov" >> "$GITHUB_OUTPUT"

          if [ "$(echo "$cov >= 95" | bc -l)" -eq 1 ]; then
            echo "cov_color=brightgreen" >> "$GITHUB_OUTPUT"
          elif [ "$(echo "$cov >= 90" | bc -l)" -eq 1 ]; then
            echo "cov_color=green" >> "$GITHUB_OUTPUT"
          elif [ "$(echo "$cov >= 80" | bc -l)" -eq 1 ]; then
            echo "cov_color=yellowgreen" >> "$GITHUB_OUTPUT"
          else
            echo "cov_color=red" >> "$GITHUB_OUTPUT"
          fi

          vllm=$(grep -oP 'vllm==\K[^"]+' auto-vllm/pyproject.toml)
          echo "vllm=$vllm" >> "$GITHUB_OUTPUT"

          llamacpp=$(grep -oP 'DEFAULT_LLAMACPP_VERSION = "\K[^"]+' inference_proxy/config/settings.py)
          echo "llamacpp=$llamacpp" >> "$GITHUB_OUTPUT"

      - name: Update coverage badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@e9a478b16159b4d31420099ba146cdc50f134483 # v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 188b760b19592c8913101f598f7cb382
          filename: qiip-coverage.json
          label: coverage
          message: "${{ steps.badges.outputs.coverage }}%"
          color: ${{ steps.badges.outputs.cov_color }}

      - name: Update vLLM badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@e9a478b16159b4d31420099ba146cdc50f134483 # v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 188b760b19592c8913101f598f7cb382
          filename: qiip-vllm.json
          label: vLLM
          message: "v${{ steps.badges.outputs.vllm }}"
          color: blue

      - name: Update llama.cpp badge
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: schneegans/dynamic-badges-action@e9a478b16159b4d31420099ba146cdc50f134483 # v1.7.0
        with:
          auth: ${{ secrets.GIST_SECRET }}
          gistID: 188b760b19592c8913101f598f7cb382
          filename: qiip-llamacpp.json
          label: llama.cpp
          message: "${{ steps.badges.outputs.llamacpp }}"
          color: blue

  compatibility:
    name: Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Resolve pinned uv version
        id: uv_pin
        shell: bash
        run: |
          version="$(<auto-vllm/.uv-version)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=auto-vllm/.uv-version::Expected a semantic version, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          version: ${{ steps.uv_pin.outputs.version }}

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Test
        run: uv run --frozen pytest
