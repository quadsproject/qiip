name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Resolve pinned uv version
        id: uv_pin
        shell: bash
        run: |
          version="$(<auto-vllm/.uv-version)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=auto-vllm/.uv-version::Expected a semantic version, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.12"
          version: ${{ steps.uv_pin.outputs.version }}

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Lint
        run: uv run --frozen ruff check .

      - name: Check formatting
        run: uv run --frozen ruff format --check .

      - name: Check node dependency lock
        env:
          UV_PROJECT_ENVIRONMENT: /tmp/auto-vllm-lock-check
        run: |
          uv lock --check --project auto-vllm
          uv sync --project auto-vllm --frozen --no-dev --no-install-project --no-build --python 3.12 --python-platform x86_64-manylinux_2_34 --dry-run

      - name: Check node scripts
        run: shellcheck auto-vllm/*.sh

      - name: Type check
        run: uv run --frozen mypy inference_proxy

      - name: Test
        run: uv run --frozen pytest

  compatibility:
    name: Python 3.13
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"

      - name: Resolve pinned uv version
        id: uv_pin
        shell: bash
        run: |
          version="$(<auto-vllm/.uv-version)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error file=auto-vllm/.uv-version::Expected a semantic version, got '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Install uv and Python
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          enable-cache: true
          python-version: "3.13"
          version: ${{ steps.uv_pin.outputs.version }}

      - name: Install dependencies
        run: uv sync --locked --all-groups

      - name: Test
        run: uv run --frozen pytest
